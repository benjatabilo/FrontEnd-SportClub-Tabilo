<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | SportClub</title>

    <link rel="stylesheet" href="../css/style_login.css">
</head>

<body>

    <header>

        <div class="logo-header">
            <img src="../assets/img/logo.png" alt="Logo SportClub">
        </div>

        <nav>
            <a href="../index.html">Inicio</a>
            <a href="../index.html#beneficios">Beneficios</a>
            <a href="../index.html#planes">Planes</a>
            <a href="../index.html#sobre">Nosotros</a>

            <a href="./login.html" class="btn-login">
                Iniciar Sesion
            </a>
        </nav>

    </header>

    <main class="login-container">

        <section class="card">

            <img 
                src="../assets/img/logo.png" 
                alt="Logo SportClub"
                class="logo"
            >

            <h1>Iniciar Sesión</h1>

            <form id="loginForm">

                <input
                    type="email"
                    id="email"
                    placeholder="Correo electrónico"
                    required
                >
                <span id="emailError" style="color: #b91c1c; font-size: 13px; margin-top: -12px; margin-bottom: 12px; display: none; font-weight: bold; text-align: left; padding-left: 5px;"></span>

                <input
                    type="password"
                    id="password"
                    placeholder="Contraseña"
                    required
                >
                <span id="passwordError" style="color: #b91c1c; font-size: 13px; margin-top: -12px; margin-bottom: 12px; display: none; font-weight: bold; text-align: left; padding-left: 5px;"></span>

                <button type="submit">
                    Ingresar
                </button>

                <p id="loginMessage"></p>

            </form>

            <div class="links">

                <a href="./recuperar.html">
                    ¿Olvidaste tu contraseña?
                </a>

                <a href="./register.html">
                    Registrarse
                </a>

            </div>

            <div class="accesos">

                <p>Accesos rápidos</p>

                <a href="./dashboard_usuario.html">
                    Dashboard Usuario
                </a>

                <a href="./dashboard_coach.html">
                    Dashboard Coach
                </a>

                <a href="./dashboard_admin.html">
                    Dashboard Administrador
                </a>

            </div>

        </section>

    </main>

    <footer>

        <h3>SportClub</h3>

        <p>
            Tu mejor version comienza hoy.
        </p>

        <div class="redes">

            <a href="#">Instagram</a>

            <a href="#">Facebook</a>

            <a href="#">TikTok</a>

        </div>

        <p class="copy">
            © 2026 SportClub - Todos los derechos reservados
        </p>

    </footer>
    
    <script src="../js/login.js"></script>

</body>

</html>
